name: Bug report
description: Report a problem with Tabletop Dice Roller
title: ""
body:
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium
        - Edge
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: If known.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the affected site/page type if relevant. Do not include passwords, tokens, private account data, or sensitive browsing information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
